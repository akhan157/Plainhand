name: GitHub release

# Pushing a version tag (v1.0.0) publishes a GitHub release whose notes come
# from docs/releases/<tag>.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check release notes exist
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Plainhand ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --verify-tag
