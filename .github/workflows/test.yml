name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: npm ci
      # The browser tests drive a real Chromium; PDF import tests use pdftotext.
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends poppler-utils xvfb
      - run: xvfb-run -a node tests/test-all.mjs --quick

  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Postgres-backed suites (storage, accounts, app, OAuth); the remaining cloud
      # suites run against MemoryStorage workspaces. The extension suite needs Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud
        env:
          PLAINHAND_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run build:cloud:trace
      - run: docker run --rm -e VERCEL=1 -v "$PWD/tmp/hosted-trace:/app:ro" -w /app node:22-bookworm-slim node scripts/cloud/render-smoke.mjs
      - name: Exercise encrypted backup restore with synthetic Postgres data
        run: |
          docker exec ${{ job.services.postgres.id }} apk add --no-cache age bash
          docker exec ${{ job.services.postgres.id }} mkdir -p /app/scripts
          docker cp scripts/cloud ${{ job.services.postgres.id }}:/app/scripts/
          docker exec -u postgres ${{ job.services.postgres.id }} bash /app/scripts/cloud/backup-smoke.sh
      - run: npm run test:cloud-ui
      - run: npm run test:extension
